
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Lab | Hola Mundo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <div class="card">

            <div class="icon"></div>

            <span class="tag">MI PRIMER PROYECTO DEVOPS</span>

            <h1>¡Hola, mundo!</h1>

            <p class="description">
                Mi primera aplicación web ejecutándose
                dentro de un contenedor Docker.
            </p>

            <div class="divider"></div>

            <h3>Información de la aplicación</h3>

            <div class="info">
                <span>Lenguaje</span>
                <strong>Node.js</strong>
            </div>

            <div class="info">
                <span>Framework</span>
                <strong>Express</strong>
            </div>

            <div class="info">
                <span>Contenedorización</span>
                <strong>Docker</strong>
            </div>

            <div class="info">
                <span>Puerto</span>
                <strong>3000</strong>
            </div>

            <div class="status">
                <span class="dot"></span>
                Aplicación funcionando correctamente
            </div>

        </div>

        <footer>
            Práctica de DevOps · ITLA
        </footer>
    </main>

</body>
</html>
